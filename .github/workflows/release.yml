name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prebuild native Android project
        run: npx expo prebuild -p android --clean --no-install

      - name: Assemble release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Generate SHA-256 checksum
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/checksums.txt
          generate_release_notes: true
